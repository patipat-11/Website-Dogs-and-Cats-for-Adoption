<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>
<body>
  <!-- solid style -->
    
    <div class="form">
        <img src="dog&cat.jpg" alt="DOG" class="Images">
        <div class="loginform">
            <h1 class="wel">Welcome</h1>
            <div class="logintype">
                <h4>Email / Username</h4>
                <input type="Email" class="typemail">
                <h4>Password</h4>
                <input type="password" class="pass">
                <button class="loginbutton"><a href="index.html">Login</a></button>
                <p>OR</p>
                <div class="buttonsec">
                    <span><button class="google"><i class="fa-brands fa-google"></i></button></span>
                    <span><button class="facebook"><i class="fa-brands fa-facebook"></i></button></span>
                    <span><button class="apple"><i class="fa-brands fa-apple"></i></button></span>
                </div>
            </div>
            <div class="register">
                    <p>Don't have account? <span class="Re"><a href="#">Register now</a></span></p>
            </div>
        </div>
    </div>
</body>
</html>
